<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
<title id="title">一天的三个阶段</title>
<desc id="desc">早晨先启动身体，白天围绕真实反馈改进系统，晚上整理知识并反思如何内化。</desc>
<rect width="960" height="300" rx="20" fill="#f3f9f6"/>
<path d="M130 135 H830" stroke="#b7d2c7" stroke-width="6" stroke-linecap="round"/>
<path d="M130 135 H830" stroke="#147f80" stroke-width="2" stroke-dasharray="5 13"/>
<g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">
  <g><circle cx="160" cy="135" r="43" fill="#d6f1eb" stroke="#147f80" stroke-width="3"/><text x="160" y="143" font-size="23" fill="#203035">早晨</text><text x="160" y="215" font-size="18" fill="#147f80">启动</text><text x="160" y="244" font-size="14" fill="#53676d">刷牙 · 早餐 · 计划</text></g>
  <g><circle cx="480" cy="135" r="43" fill="#ffecd9" stroke="#d06d4d" stroke-width="3"/><text x="480" y="143" font-size="23" fill="#203035">白天</text><text x="480" y="215" font-size="18" fill="#b65d3e">迭代</text><text x="480" y="244" font-size="14" fill="#53676d">沟通 · 反馈 · 控制感</text></g>
  <g><circle cx="800" cy="135" r="43" fill="#ebe5ff" stroke="#7461ba" stroke-width="3"/><text x="800" y="143" font-size="23" fill="#203035">晚上</text><text x="800" y="215" font-size="18" fill="#7461ba">沉淀</text><text x="800" y="244" font-size="14" fill="#53676d">教程 · 数学 · 手写理解</text></g>
</g>
</svg>
