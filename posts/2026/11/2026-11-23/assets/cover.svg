<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="focus-title focus-desc">
<title id="focus-title">把入口放在行动之前：注意力的两条路径</title>
<desc id="focus-desc">深蓝底色上，从手机打开的共同起点分为两条路径：下方的即时内容接续滑动，上方的提前准备则连接选择音频、自己复述和理解检验。上方是想尝试的新路径，并不代表习惯已建立。</desc>
<defs>
  <linearGradient id="focus-background" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#172a3c"/><stop offset="1" stop-color="#101a2b"/>
  </linearGradient>
  <linearGradient id="focus-active" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#9ce2cc"/><stop offset="1" stop-color="#f7c18a"/>
  </linearGradient>
  <marker id="focus-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
    <path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#c2e4d8" stroke-width="1.5"/>
  </marker>
</defs>
<rect width="1200" height="540" rx="26" fill="url(#focus-background)"/>
<circle cx="1053" cy="85" r="177" fill="#29445a" opacity=".22"/>
<circle cx="90" cy="490" r="160" fill="#2b4b58" opacity=".22"/>
<g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
  <text x="70" y="76" font-size="19" fill="#9fb5ca" letter-spacing="5">NOV 23  /  AN EXPERIMENT IN ATTENTION</text>
  <text x="70" y="128" font-size="40" font-weight="700" fill="#f7f1e7">同一次打开手机，不同的下一步</text>
  <text x="70" y="166" font-size="21" fill="#c0cdda">区别不在手机，而在行动开始前，准备了什么。</text>
  <rect x="70" y="225" width="160" height="156" rx="20" fill="#263b4b" stroke="#6c8f98" stroke-width="2"/>
  <rect x="122" y="242" width="56" height="92" rx="11" fill="none" stroke="#c5d8d5" stroke-width="3"/>
  <path d="M144 251 H155" stroke="#c5d8d5" stroke-width="2" stroke-linecap="round"/>
  <circle cx="150" cy="321" r="4" fill="#c5d8d5"/>
  <text x="150" y="365" font-size="21" text-anchor="middle" fill="#f4f5ee">打开手机</text>
  <path d="M231 275 C290 275 288 242 347 242 L986 242" stroke="url(#focus-active)" stroke-width="6" fill="none" marker-end="url(#focus-arrow)"/>
  <path d="M231 339 C300 339 289 418 352 418 L991 418" stroke="#8795a4" stroke-opacity=".7" stroke-width="4" fill="none" stroke-dasharray="10 12"/>
  <g text-anchor="middle">
    <rect x="352" y="206" width="176" height="75" rx="15" fill="#264d4b" stroke="#76cbb7"/>
    <text x="440" y="238" font-size="23" font-weight="700" fill="#eafbf4">提前选好音频</text>
    <text x="440" y="263" font-size="17" fill="#b4ddca">可倍速播放</text>
    <rect x="572" y="206" width="176" height="75" rx="15" fill="#264d4b" stroke="#76cbb7"/>
    <text x="660" y="238" font-size="23" font-weight="700" fill="#eafbf4">用自己的话说</text>
    <text x="660" y="263" font-size="17" fill="#b4ddca">而不只是听过</text>
    <rect x="794" y="206" width="194" height="75" rx="15" fill="#594536" stroke="#e0ab76"/>
    <text x="891" y="238" font-size="23" font-weight="700" fill="#ffefd6">举例检验理解</text>
    <text x="891" y="263" font-size="17" fill="#f1c89b">下一步要尝试</text>
  </g>
  <g font-size="20" fill="#aebaca">
    <text x="350" y="389">没有提前准备 → 打开短视频 → 继续滑动</text>
  </g>
  <text x="1024" y="421" font-size="17" fill="#93a5b6">当天经历</text>
  <text x="1017" y="242" font-size="17" fill="#f3cfac">计划路径</text>
  <path d="M70 468 H1130" stroke="#3e5569"/>
  <text x="70" y="504" font-size="18" fill="#c7d3d9">图解为编辑性归纳：准备好入口 ≠ 已经养成习惯；真正的理解仍需自己完成。</text>
</g>
</svg>