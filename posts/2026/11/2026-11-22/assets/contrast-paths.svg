<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 405" role="img" aria-labelledby="contrast22title contrast22desc">
<title id="contrast22title">准备与收尾的两条路径</title>
<desc id="contrast22desc">上半部分是用户已体验到的做饭顺畅路径：准备和整理、按步骤做、轻松愉快。下半部分是待探索的游戏收尾问题：玩游戏、何时停下尚不明确、愧疚和困惑，不声称是已证明的因果链。</desc>
<defs><marker id="arrow22a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#9b6d52"/></marker><marker id="arrow22b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#5a7885"/></marker></defs>
<rect x="0" y="0" width="980" height="405" rx="18" fill="#fffaf4"/>
<rect x="25" y="25" width="930" height="157" rx="15" fill="#f7e8d9"/>
<rect x="25" y="219" width="930" height="157" rx="15" fill="#e9eff1"/>
<text x="48" y="58" font-size="18" font-weight="700" fill="#925337">亲自体验 · 厨房</text>
<text x="48" y="252" font-size="18" font-weight="700" fill="#415e69">尚待弄清 · 游戏</text>
<g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle">
<rect x="60" y="91" width="232" height="66" rx="12" fill="#fffdf7" stroke="#dbbba3"/><text x="176" y="132" fill="#4f4541">先准备、边整理</text>
<rect x="374" y="91" width="232" height="66" rx="12" fill="#fffdf7" stroke="#dbbba3"/><text x="490" y="132" fill="#4f4541">按步骤做</text>
<rect x="688" y="91" width="232" height="66" rx="12" fill="#fffdf7" stroke="#dbbba3"/><text x="804" y="132" fill="#4f4541">感到轻松愉快</text>
<rect x="60" y="285" width="232" height="66" rx="12" fill="#fdfefe" stroke="#b9cbd1"/><text x="176" y="326" fill="#40545c">打开《和平精英》</text>
<rect x="374" y="285" width="232" height="66" rx="12" fill="#fdfefe" stroke="#b9cbd1"/><text x="490" y="313" fill="#40545c">什么时候停下？</text><text x="490" y="338" font-size="14" fill="#7b6873">需要探索的环节</text>
<rect x="688" y="285" width="232" height="66" rx="12" fill="#fdfefe" stroke="#b9cbd1"/><text x="804" y="326" fill="#40545c">愧疚、困惑</text>
</g>
<path d="M298 124H364M612 124H678" stroke="#9b6d52" stroke-width="3" marker-end="url(#arrow22a)"/>
<path d="M298 318H364M612 318H678" stroke="#5a7885" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow22b)"/>
<text x="980" y="400" font-size="1" fill="#fffaf4"> </text>
</svg>