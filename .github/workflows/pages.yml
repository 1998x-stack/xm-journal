name: Build, collect and publish xm-journal
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "15 16 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Asia/Shanghai date to collect (YYYY-MM-DD; blank = today)"
        required: false
        type: string
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Collect GitHub evidence and generate reports
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOURNAL_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$JOURNAL_DATE" ]; then
            python scripts/journal_pipeline.py --date "$JOURNAL_DATE"
          else
            python scripts/journal_pipeline.py
          fi
      - name: Persist daily evidence and generated reports
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/entries.json data/latest-activity.json data/github_activity reports
          if ! git diff --cached --quiet; then
            git commit -m "journal: collect daily GitHub activity and refresh reports"
            git push
          fi
      - name: Build static site
        run: python scripts/build_site.py
      - name: Validate generated site
        run: python scripts/validate_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
