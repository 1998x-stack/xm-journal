<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="journal:date" content="{{DATE}}">
<meta name="journal:title" content="{{TITLE}}">
<meta name="journal:summary" content="{{SUMMARY}}">
<meta name="journal:category" content="{{CATEGORY}}">
<meta name="journal:category-label" content="{{CATEGORY_LABEL}}">
<meta name="journal:tags" content="{{TAGS}}">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="{{CSS_PATH}}">
</head>
<body>
<a class="skip-link" href="#content">跳转至正文</a>
<div class="layout">
<nav class="toc" aria-label="文章目录">{{TOC}}</nav>
<main id="content"><article>
<header class="article-header">
<p class="eyebrow">{{DATE}}</p>
<h1>{{TITLE}}</h1>
<p class="dek">{{DEK}}</p>
</header>
<section id="opening"><h2>今天发生了什么？</h2><p>从一个具体场景开始，解释当天最重要的经历。</p></section>
<section id="insight"><h2>今天真正意识到的事情</h2><p>把主观感受、事实和编辑性归纳区分开。</p></section>
<section id="action"><h2>下一步</h2><p>只写用户明确提出或确认的行动。</p></section>
</article></main>
</div>
<script src="{{JS_PATH}}"></script>
</body>
</html>
